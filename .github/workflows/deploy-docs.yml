name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages (danghong-docs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Create Pages project if missing
        run: npx wrangler pages project list | grep -q "danghong-docs" || npx wrangler pages project create danghong-docs --production-branch main
      - name: Deploy
        run: npx wrangler pages deploy .vitepress/dist --project-name danghong-docs --branch main --commit-hash ${{ github.sha }}
