name: Deploy media

on:
  push:
    branches: [main]
    paths:
      - "media/**"
      - ".github/workflows/deploy-media.yml"
  workflow_dispatch:

concurrency:
  group: deploy-media
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Functions to Cloudflare Pages (danghong-media)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: media/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Create Pages project if missing
        run: npx wrangler pages project list | grep -q "danghong-media" || npx wrangler pages project create danghong-media --production-branch main
      - name: Deploy
        run: npx wrangler pages deploy --project-name danghong-media --branch main --commit-hash ${{ github.sha }}
