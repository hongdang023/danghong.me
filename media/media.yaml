        summary: Dạy tôi về Products Mindset, người đầu tiên dẫn tôi đến thế giới Vibe Coding và thế giới của người làm sản phẩm, hỗ trợ tôi để phong cách làm việc senior hơn.
        lessons:
          - Tư duy làm sản phẩm (Products Mindset) thực tế.
          - Tiếp cận thế giới Vibe Coding và tư duy của người trực tiếp làm sản phẩm.
          - Rèn luyện phong cách làm việc chuyên nghiệp, senior hơn.
      - id: anh-nhat-anh
        name: Anh Nhật Anh
        role: Bạn bè & Người đồng hành
        note: Người bạn tôi gặp ở Mở
        album: mo
        summary: Tôi ngưỡng mộ anh vì anh là người giàu (tài chính và trải nghiệm), chưa có gì trên đời bạn nghĩ ra mà anh ấy chưa làm (từ F&B, Tarot, Công nghệ, Tài chính...) và kể cả thế, anh vẫn rất gần gũi với tụi trẻ chúng tôi. Anh chính là hình mẫu tôi muốn trở thành vào năm 30 tuổi — “một người giàu tử tế”.
        lessons:
          - Lối sống giàu tài chính kết hợp giàu trải nghiệm sâu sắc.
          - Sự gần gũi, khiêm tốn và không có khoảng cách nào với thế hệ trẻ.
          - Tinh thần không ngừng học hỏi và làm mới mình.
      - id: dien-quang
        name: Điện Quang
        role: Bạn bè & Người đồng hành
        note: Người bạn tôi gặp ở Mở
        album: kinergie-dance
        summary: Tôi gặp Quang ở lớp Ngoại ngữ 2 ở Chuyên Ngữ, nhưng chưa thân. Sau gặp lại ở Mở chắc đúng thời điểm hơn nên nói chuyện miết. Người bạn rất chân thật, nghĩ gì nói nấy, với gu và cá tính siêu mạnh trong nghệ thuật — người đưa tôi đến thế giới múa đương đại và giúp tôi tự tin chấp nhận mình là người yêu sân khấu và “spotlight”.
        lessons:
          - Sự chân thật tuyệt đối, nghĩ gì nói nấy.
          - Gu thẩm mỹ và cá tính nghệ thuật cực kỳ mạnh mẽ.
          - Giải phóng cơ thể, tự tin vào bản thân.
      - id: minh-giang
        name: Minh Giang
        role: Bạn bè & Người đồng hành
        note: Người bạn yêu quý từ thời cấp 2
        album: film
        summary: Bạn là người rủ tôi thi vào Chuyên Ngữ (dẫu là 2 tháng trước khi thi) — không có bạn, chắc tôi cũng không có bước ngoặt đổi đời đến thế. Chúng tôi cùng nhau mở Vòng về Phim — tổ chức cho người trẻ yêu phim — vào năm lớp 10. Ở gần bạn làm tôi luôn phải nghĩ xa hơn chính bản thân mình.
        lessons:
          - Những cơ duyên bất ngờ tạo nên bước ngoặt cuộc đời.
          - Cùng nhau khởi nghiệp sáng tạo từ sớm (mở Vòng về Phim năm lớp 10).
          - Nhìn xa hơn để biết mình muốn tận hiến cuộc đời cho điều gì.

# ─────────────────────────────────────────────────────────────── CÂU CHUYỆN
# `body`: đoạn văn cách nhau bằng một dòng trống. `sections`: các phần có tiêu đề (tùy chọn).
# `link`: bài viết gốc ở nơi khác (Substack…). `cover`: ảnh bìa, `album`: id album liên quan.
stories:
  - id: me-tri-thuc
    title: Mẹ — hiện thân của tri thức và khát vọng vượt khó
    cover: photos/family/me/me-01.jpg
    album: gia-dinh-me
    tags: [gia đình]
    summary: Ba câu chuyện về người đã nuôi dưỡng lòng ham học của mình.
    sections:
      - title: 01. Mẹ chính là hiện thân của tri thức và khát vọng vượt khó không mệt mỏi
        body: >-
          Mẹ xuất thân là con cả ở một gia đình Thái Bình (cũ). Dù phải chăm em thơ, làm ruộng, mẹ vẫn
          tranh thủ học để đỗ đại học lên Hà Nội. Khi có con đầu lòng (là tôi), mẹ vừa chăm tôi vừa học
          văn bằng hai. Đầu giường mẹ lúc nào cũng chất đầy sách đủ lĩnh vực: kinh tế, tâm lý, phong thủy,
          y học cổ truyền... Mẹ là hình mẫu lớn nhất về việc tự học đối với tôi.
      - title: 02. Mẹ ủng hộ vô điều kiện những ý tưởng nghe “điên điên” của tôi
        body: |-
          Hồi cấp 1, tôi muốn bán bánh kẹo cho các bạn ở lớp học thêm vì lúc đó mọi người hay đói. Mẹ không cấm mà còn dạy tôi cách làm sổ sách quản lý thu chi, rồi rót vốn cho tôi nhập hàng. Tôi bán chạy đến mức thầy chủ trung tâm bảo nếu có bảng vàng danh dự chắc chắn sẽ có tên tôi.

          Đến năm lớp 10, tôi học tiếng Hàn rất dở. Mẹ thấy dưới nhà có nhà hàng Hàn Quốc liền khuyên tôi xuống xin việc phục vụ để thực hành. Dù tôi sợ hãi viện đủ lý do, mẹ vẫn dắt tôi xuống và thuyết phục ông chủ Hàn Quốc nhận tôi (vì ông ấy xa quê nên rất cần người trò chuyện). Công việc đó đã cho tôi những va chạm xã hội vô giá.
      - title: 03. Mẹ dạy tôi về tâm thế đón nhận cuộc sống
        body: >-
          Mẹ luôn bảo: “Con cứ nhẹ nhàng với cuộc đời thì cuộc đời cũng sẽ nhẹ nhàng với con thôi”. Nhờ câu
          nói đó, mỗi khi gặp khó khăn hay nỗi sợ, tôi lại xem đó là cơ hội phản tư, vượt qua con dốc khúc
          khuỷu để học thêm nhiều bài học mới.

  - id: chuyen-tinh-bo-me
    title: Chuyện tình của bố mẹ
    cover: photos/family/bo/bo-01.jpg
    tags: [gia đình]
    summary: Hai phiên bản của cùng một câu chuyện — và một điều chắc chắn.
    body: |-
      Theo như lời mẹ tôi kể thì mẹ tôi xinh gái học giỏi nhất lớp nên bố tôi theo đuổi với nhiều anh khác. Không hiểu sao dính bùa mê thuốc lú gì lại chọn bố tôi (dù mặt rõ là xấu giai :)).

      Còn bố tôi thì kể do bố tôi học giỏi với hay chở mẹ, chở cả em gái em trai mẹ đi học 10 cây số nên mẹ tôi mới đổ bố trước.

      Không biết version nào là thật nhưng chắc chắn một điều là: Bố mẹ tôi học chung trường đại học với nhau nhưng khác lớp. Quen nhau nhờ một lần học chung tín chỉ và được bè bạn gán ghép.

  - id: nep-nha
    title: Nếp nhà
    cover: photos/family/minh-chau/minh-chau-02.jpg
    tags: [gia đình]
    summary: Những thói quen nhỏ giữ cả nhà lại gần nhau.
    body: |-
      Ăn cơm với nhau ít nhất 1 bữa gần như hàng ngày. Phòng ăn tách riêng với phòng khách, nên không bao giờ bật TV mà tập trung ăn uống nói chuyện.

      Đón ngày sinh nhật với nhau — lần nào cũng mở tiệc rất to, mua bánh kem rồi mời họ hàng đến nhà ăn lẩu.

  - id: tot-nghiep-neu
    title: Tốt nghiệp loại Xuất sắc ĐH Kinh tế Quốc dân
    date: 2026-08
    cover: photos/graduation.jpg
    album: tot-nghiep
    tags: [cột mốc]
    summary: Khép lại chặng đường đại học cùng gia đình.
    body: |-
      Tốt nghiệp loại Xuất sắc Khoa Quản trị Kinh doanh Quốc tế, Viện Tiên tiến, Chất lượng cao và POHE — Đại học Kinh tế Quốc dân.

      Trên chặng đường đó: Giải Nhì Sinh viên nghiên cứu khoa học cấp Đại học 2026, Top 15 Map The System (Đại học Oxford × NEU) vòng Local, Top 3 Sustainable Entrepreneurship Fellowship do NIC và Đại sứ quán Mỹ tổ chức.

  - id: improv-101
    title: Buổi học cuối của 12 “thợ ứng tác”
    cover: photos/communities/improv-hub/improv-hub-00.jpg
    album: improv-hub
    tags: [cộng đồng, nghệ thuật]
    summary: Lớp IMPROV 101 (tiếng Anh) tại The Improv Hub.
    body: >-
      Một buổi chiều chủ nhật mùa hè, 12 “thợ ứng tác” mới toe của lớp IMPROV 101 (tiếng Anh) đã hoàn thành
      buổi 8 - buổi cuối cùng của khoá học. Cảm ơn cả lớp đã dìu tui đến buổi học cuối (nghỉ mất 1 hôm đi viện,
      1 hôm mẹ ốm, 1 hôm mệcc ngủ quên).

  - id: lop-ai-teen
    title: Sau giờ làm sản phẩm ở lớp AI Teen
    cover: photos/communities/sutucon/sutucon-00.jpg
    album: sutucon
    tags: [cộng đồng, giáo dục]
    summary: Sư Tử Con School.
    body: >-
      Một khoảnh khắc bình thường nhưng đáng nhớ sau giờ làm sản phẩm. Tui rất yêu khoảng thời gian được gặp
      các bé ở lớp AI Teen, vì các bé đều rất đáng yêu, nhiều chuyện hay ho để kể.

