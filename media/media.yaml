# ─────────────────────────────────────────────────────────────── GIỚI THIỆU
# Nội dung trang Giới thiệu. Mỗi đoạn văn trong `paragraphs` là một đoạn.
about:
  journey:
    title: Hành trình và Góc nhìn về Giáo dục
    quote: >-
      Mình luôn bắt đầu bằng câu hỏi: Việc này có thực sự giúp một người phát triển hơn
      và tiến gần hơn tới mục tiêu của họ không?
    paragraphs:
      - >-
        Mình đến với giáo dục qua một hành trình khá vòng vèo: từ Chuyên Ngữ, sang Kinh tế ở
        ĐH Kinh tế Quốc dân, rồi đi làm qua Marketing, HR, và cuối cùng dừng lại ở Giáo dục.
        Mỗi chặng đều cho mình một góc nhìn khác về con người, về cách họ học, làm việc và phát triển.
      - >-
        Trong quá trình đó, mình gặp những người thầy và những môi trường đã thay đổi cách mình
        nhìn thế giới. Có nơi khiến mình nhận ra một chương trình dù rất chỉn chu vẫn có thể vô
        nghĩa nếu người học không thay đổi được cách nghĩ và cách làm sau khi kết thúc. Có nơi lại
        cho mình thấy sức mạnh của việc đặt câu hỏi đúng, lắng nghe đúng và để người học tự chịu
        trách nhiệm cho sự tiến bộ của mình.
      - >-
        Từ đó, mình quan tâm nhiều hơn đến một câu hỏi: điều gì thật sự làm một người phát triển?
        Với mình, đó không chỉ là học thêm kiến thức, mà là biết tự học, tự đánh giá, tự tiến lên,
        và cuối cùng có thể tạo ra thứ gì đó người khác thật sự cần (make something people want).
      - >-
        Mình tin con người hạnh phúc nhất khi họ tiếp tục phát triển và khai mở tiềm năng của mình.
        Vì vậy, mình chọn giáo dục như một con đường bền vững để tạo ra tác động. Nhưng với mình,
        giáo dục không chỉ là truyền đạt nội dung; đó là thiết kế môi trường, trải nghiệm và hệ thống
        đủ tốt để một người thay đổi cách họ tư duy, học tập và hành động trong đời sống thực.
      - >-
        Đó cũng là lý do mình dành nhiều thời gian cho việc nghiên cứu cách con người học, cách tạo
        động lực, cách thiết kế chương trình đào tạo và xây dựng hệ thống học tập bền vững. Mình đang
        trực tiếp tham gia vào việc xây dựng rubric, hệ thống đánh giá, LMS, quy trình phản hồi và các
        cấu trúc học tập để việc học không dừng ở cảm hứng, mà tạo ra tiến bộ nhìn thấy được, đo lường được.
      - >-
        Với mình, một hệ thống giáo dục tốt không chỉ khiến người học thấy “hay” trong lúc học. Nó phải
        giúp họ tự học, tự tạo ra giá trị, và tiếp tục phát triển ngay cả khi không còn người dạy bên cạnh.

  beliefs:
    title: Niềm tin cốt lõi
    items:
      - title: Phát triển là Hạnh phúc
        text: Con người chỉ thực sự hạnh phúc khi họ không ngừng phát triển. Đây là niềm tin mạnh nhất chi phối mọi quyết định.
      - title: Giáo dục là Chìa khóa
        text: Giáo dục là cách bền vững nhất để giúp con người phát triển. Lý do mình chọn giáo dục thay vì lĩnh vực khác.
      - title: Hệ thống > Cá nhân
        text: Một hệ thống tốt quan trọng hơn một cá nhân giỏi. Vì vậy mình thích xây framework, LMS, rubric và quy trình.
      - title: Lãnh đạo là Trao quyền
        text: Người lãnh đạo giỏi là người giúp người khác không còn phụ thuộc vào mình. Nhất quán với việc xây dựng hệ thống tự vận hành.
      - title: Thành công & Tử tế
        text: Thành công chỉ thực sự có ý nghĩa khi đi cùng với sự tử tế và tạo ra giá trị thực chất cho người khác.

  philosophy:
    title: Triết lý làm việc
    items:
      - title: Make something people want
        text: Tạo ra thứ mọi người thực sự cần. Tập trung vào giá trị thực tế và giải quyết các bài toán cụ thể của người học, thay vì xây dựng các lý thuyết hào nhoáng nhưng sáo rỗng.
      - title: Reflect and Act
        text: Suy ngẫm và Hành động. Liên tục nhìn nhận lại bản thân, đánh giá các hệ thống để phát hiện điểm mù, đồng thời quyết liệt chuyển hóa nhận thức mới thành những cải tiến thực tế.
      - title: Be authentic
        text: Luôn chân thực và chính trực. Làm phải có giá trị thật, học phải học được thật, và dạy phải giúp người học thực sự tiến bộ. Không thỏa hiệp với các giá trị “đánh bóng” bề mặt.
      - title: Học, học nữa, học mãi
        text: Không bao giờ dừng lại. Tự học là kỹ năng sống còn. Chủ động tìm kiếm mentor, học từ những người xuất sắc nhất và không ngừng mở rộng giới hạn nhận thức của chính mình.

  practices:
    title: Lĩnh vực trọn đời
    intro: Ba lĩnh vực mình muốn dành cả đời để nghiên cứu, thực hành và chiêm nghiệm.
    items:
      - title: Instructional Design & Learning Science
        text: Khoa học học tập và thiết kế chương trình. Nghiên cứu cách con người tiếp thu tri thức để kiến tạo những hệ thống, rubric và trải nghiệm giúp tối ưu hóa sự phát triển thực chất thay vì chỉ dừng lại ở cảm hứng hay điểm số.
      - title: Communication Intelligence
        text: Trí tuệ giao tiếp. Đến từ chính nỗi đau của bản thân trong việc kết nối với chính mình, với bạn bè và bố mẹ. Thực hành lắng nghe sâu, thấu cảm và mở rộng nhận thức để thiết kế những cuộc hội thoại mở lòng.
      - title: Digital Products
        text: Kiến tạo sản phẩm số. Quá trình trực tiếp xây dựng và thử nghiệm các công cụ (LMS, template...) dạy cho mình những bài học sâu sắc về sự thấu hiểu người dùng, giải quyết vấn đề và tính thực chất (authenticity) - làm ra thứ mọi người thực sự cần.

