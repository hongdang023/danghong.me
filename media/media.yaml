# media.danghong.me — nguồn dữ liệu duy nhất cho thông tin, ảnh, video và link về Hồng.
#
# Cách dùng nhanh:
#   - Thêm ảnh/tài liệu/video nhỏ: thả file vào media/files/<thư mục>/ (tự được liệt kê).
#   - Thêm tiêu đề, mô tả, tag cho một file: khai báo trong mục `files` bên dưới.
#   - Thêm link: thêm một dòng vào nhóm phù hợp trong `links`.
#   - Thêm video YouTube/Drive: thêm vào `videos` với `url` là link ngoài.
# Hướng dẫn đầy đủ: https://docs.danghong.me/C_IMPLEMENTATION/C3_Media_Library

profile:
  name: Hồng Đặng
  name_en: Hong Dang
  title: The Learning Architect
  tagline: Evidence-Based Learning. Architected.
  location: Vietnam
  avatar: photos/avatar.png
  bio: >-
    Mình là người kiến tạo những hệ thống và trải nghiệm giúp con người không ngừng
    phát triển và khai mở tiềm năng của chính mình, vì mình tin rằng đó là con đường
    bền vững nhất để sống hạnh phúc và có ý nghĩa.
  expertise:
    - AI/Vibe Coding
    - Learning Science
    - Product Mindset
    - Interactive Evidence
    - Experience Design

